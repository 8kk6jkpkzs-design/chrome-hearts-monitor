
name: Chrome Hearts Monitor Test

on:
  workflow_dispatch:
  schedule:
    - cron: '58 16 * * *'

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Test Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"content":"Discord設定確認OK"}' \
            "$WEBHOOK_URL"
